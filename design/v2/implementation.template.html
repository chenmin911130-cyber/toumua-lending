<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toumu’a V2 · 按钮与功能清单</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;color:#18354b;background:#f5f8f9}*{box-sizing:border-box}body{margin:0}header{background:#10263b;color:white;padding:36px max(24px,calc((100vw - 1180px)/2))}header a{color:#a8e6e3}h1{font-size:32px;margin:16px 0}header p{color:#c7d6df;line-height:1.8;max-width:850px}.links{display:flex;gap:20px;flex-wrap:wrap}.links a{text-underline-offset:5px}main{max-width:1228px;margin:auto;padding:24px}.notice{border-left:4px solid #007f88;padding:12px 20px;background:#e7f4f3;line-height:1.7}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0 12px}input,select,button{font:inherit;border:1px solid #b9ccd4;background:white;color:#18354b;border-radius:7px;padding:12px}input{flex:1;min-width:230px}select{min-width:185px}button{cursor:pointer}a:focus-visible,input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid #007f88;outline-offset:3px}#count{font-size:14px;color:#526e81;margin-bottom:20px}details{background:white;border:1px solid #dce5e9;border-radius:9px;margin:10px 0;overflow:hidden}summary{cursor:pointer;padding:18px;line-height:1.5;display:flex;align-items:center;gap:14px;list-style:none}summary::before{content:'+';color:#007f88;font-size:22px;width:16px;flex-shrink:0}details[open] summary::before{content:'−'}summary .id{font-size:12px;white-space:nowrap;color:#007f88;background:#eaf6f5;padding:4px 7px;border-radius:4px}.label{flex:1;font-weight:600}.status{font-size:12px;white-space:nowrap;color:#73572c;background:#fff4de;border-radius:4px;padding:4px 7px}.body{padding:0 24px 20px;border-top:1px solid #edf1f3}.body p{line-height:1.8;overflow-wrap:anywhere}.body strong{color:#17374c}.body a{color:#007f88}.test{font-size:13px;color:#61748a}.empty{padding:50px;text-align:center}footer{font-size:13px;line-height:1.8;color:#61748a;padding:25px 0}@media(max-width:600px){h1{font-size:26px}main{padding:18px}summary{flex-wrap:wrap;gap:8px;padding:14px}.label{min-width:70%}.body{padding:0 16px 16px}.toolbar>*{width:100%}}
</style></head><body>
<header><a href="index.html">← 返回 42 张设计图</a><h1>每一个按钮，都有实现与验收依据。</h1><p>196 项交互定义，覆盖客户、员工、认证与桌面。此页是交付清单，当前没有业务功能已经实现或通过测试。</p><nav class="links" aria-label="交付文档"><a href="CURSOR_HANDOFF.md">给 Cursor 的任务书</a><a href="IMPLEMENTATION_SPEC.md">实现规范</a><a href="ACCEPTANCE_TESTS.md">验收计划</a><a href="DECISIONS.md">待配置事项</a><a href="controls.csv" download>下载 CSV 清单</a><a href="controls.json" download>下载 JSON 清单</a></nav></header>
<main><p class="notice">每页继承适用的 GLOBAL 共用控件；列表中的同义按钮均需实现。状态只能在代码完成并实际验证后更新。设计图内的金额和姓名仅供布局展示。</p>
<div class="toolbar"><input id="search" type="search" aria-label="搜索按钮或功能" placeholder="搜索编号、按钮、权限或功能，如 S18、更正、打印"><select id="screen" aria-label="按页面筛选"><option value="all">全部页面</option></select><button id="clear">清除筛选</button></div><div id="count" role="status" aria-live="polite"></div><div id="list"></div><footer>完整定义见 BUTTON_FUNCTIONS.md；错误处理统一参考 IMPLEMENTATION_SPEC.md。生产计息规则与现有数据库结构需要实际资料，不能由图片推断。</footer></main>
<script>
const controls = __CONTROLS__;
const byId=id=>document.getElementById(id);const list=byId('list');
for(const s of [...new Set(controls.map(x=>x.screen))]){const o=document.createElement('option');o.value=s;o.textContent=s==='GLOBAL'?'GLOBAL · 共用控件':s;byId('screen').append(o);}
function paragraph(label,value){const p=document.createElement('p'),b=document.createElement('strong');b.textContent=label+'：';p.append(b,document.createTextNode(value));return p;}
function render(){const q=byId('search').value.trim().toLowerCase(),s=byId('screen').value;const found=controls.filter(x=>(s==='all'||x.screen===s)&&[x.id,x.control,x.role,x.preconditions_and_validation,x.action_and_target,x.acceptance].join(' ').toLowerCase().includes(q));byId('count').textContent=`显示 ${found.length} / ${controls.length} 项 · 业务实现及测试尚未开始`;list.replaceChildren();for(const x of found){const d=document.createElement('details');d.id=x.id;const summary=document.createElement('summary');for(const [cls,t] of [['id',x.id],['label',x.control],['status',x.implementation_status==='not_implemented'?'待实现':x.implementation_status]]){const e=document.createElement('span');e.className=cls;e.textContent=t;summary.append(e);}const body=document.createElement('div');body.className='body';body.append(paragraph('权限',x.role),paragraph('条件与校验',x.preconditions_and_validation),paragraph('动作与目标',x.action_and_target),paragraph('验收',x.acceptance),paragraph('异常处理',x.failure));const t=document.createElement('p');t.className='test';t.textContent=`测试编号 ${x.acceptance_test_id} · ${x.test_status}`;body.append(t);if(x.screen!=='GLOBAL'){const a=document.createElement('a');a.href='index.html#'+x.screen;a.textContent='查看 '+x.screen+' 设计图';body.append(a);}d.append(summary,body);list.append(d);}if(!found.length){const p=document.createElement('p');p.className='empty';p.textContent='没有匹配项，请清除筛选或更换关键词。';list.append(p);}}
byId('search').addEventListener('input',render);byId('screen').addEventListener('change',render);byId('clear').onclick=()=>{byId('search').value='';byId('screen').value='all';render();byId('search').focus();};render();
</script></body></html>
